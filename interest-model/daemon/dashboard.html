<!doctype html>
<meta charset="utf-8">
<title>我的兴趣画像</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 920px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin: 26px 0 8px; color: #444; }
  .muted { color: #888; font-size: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 13px; }
  .bar-row .name { width: 130px; text-align: right; flex-shrink: 0; }
  .bar-wrap { flex: 1; background: #f0f1f3; border-radius: 4px; height: 16px; }
  .bar { height: 100%; border-radius: 4px; background: #4c86d8; }
  .bar.short { background: #45b880; }
  .bar.gap { background: #d8874c; }
  .pct { width: 48px; font-size: 12px; color: #666; }
  .drivers { font-size: 12px; color: #666; margin: 2px 0 8px 138px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  .win { font-size: 12px; margin-left: 8px; }
  .win button { border: 1px solid #ccc; background: #fff; border-radius: 4px; padding: 1px 8px; cursor: pointer; margin-right: 4px; font-size: 12px; }
  .win button.on { background: #4c86d8; color: #fff; border-color: #4c86d8; }
  #cloud { line-height: 2.1; }
  #cloud span { margin: 0 7px; display: inline-block; }
  .list { font-size: 13px; }
  .list li { margin: 4px 0; }
  .list .meta { color: #999; font-size: 11px; margin-left: 6px; }
  svg text { font-size: 10px; fill: #888; }
  .legend { font-size: 12px; color: #555; margin: 4px 0; }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
</style>
<h1>我的兴趣画像 <span class="muted" id="meta"></span></h1>
<p class="muted">全部数据只在这台机器上。</p>

<h2>内容情绪监测 <span class="muted">——平台投喂的情绪 vs 你点开的情绪（效价：+2 治愈 … −2 焦虑/愤怒）</span></h2>
<div class="legend"><i style="background:#d85c5c"></i>平台投喂 <i style="background:#45b880;margin-left:10px"></i>我的选择</div>
<svg id="emochart" width="100%" height="180" viewBox="0 0 880 180" preserveAspectRatio="none"></svg>
<div id="emomix" class="muted"></div>

<h2>词云 <span class="muted">——我点开的内容里的高频词，颜色=情绪倾向（绿正红负）</span>
  <span class="win" id="cloudwin"><button data-d="7">7天</button><button data-d="30" class="on">30天</button><button data-d="90">90天</button><button data-d="365">一年</button></span>
</h2>
<div id="cloud"></div>

<h2>专业内容整理 <span class="muted">——你点开过的专业内容（科技/知识/财经/纪实）</span>
  <span class="win" id="prowin"><button data-d="7">7天</button><button data-d="30" class="on">30天</button><button data-d="90">90天</button></span>
</h2>
<div class="cols">
  <div><h2 style="margin-top:4px">没看完的 <span class="muted">（也许值得回去补完）</span></h2><ul class="list" id="pro-unfin"></ul></div>
  <div><h2 style="margin-top:4px">看完的</h2><ul class="list" id="pro-fin"></ul></div>
</div>

<div class="cols">
  <div><h2>长期兴趣</h2><div id="long"></div></div>
  <div><h2>最近兴趣</h2><div id="short"></div></div>
</div>
<h2>投喂 vs 选择 <span class="muted">——平台给你看的（曝光）与你实际看的（互动）差距最大的主题</span></h2>
<div id="gap"></div>
<h2>兴趣的来源 <span class="muted">——每个主要兴趣背后最近看过的内容</span></h2>
<div id="drivers"></div>

<script>
const valColor = v => {
  const t = Math.max(-2, Math.min(2, v)) / 2;  // -1..1
  return t >= 0 ? `rgb(${Math.round(69+(1-t)*120)},${Math.round(140+t*44)},${Math.round(96)})`
                : `rgb(${Math.round(190+(-t)*40)},${Math.round(110+(1+t)*60)},${Math.round(90)})`;
};
async function loadEmotion() {
  const d = await (await fetch("/emotion_series?days=90")).json();
  const svg = document.getElementById("emochart");
  const all = [...d.expose, ...d.engage];
  if (!all.length) { svg.outerHTML = '<p class="muted">还没有情绪数据。</p>'; return; }
  const days = [...new Set(all.map(x => x.day))].sort((a, b) => a - b);
  const X = day => 30 + (days.indexOf(day) / Math.max(1, days.length - 1)) * 830;
  const Y = v => 90 - v * 38; // valence -2..2 -> 166..14
  let s = "";
  for (const g of [-2, -1, 0, 1, 2])
    s += `<line x1="30" x2="860" y1="${Y(g)}" y2="${Y(g)}" stroke="#eee"/><text x="2" y="${Y(g)+3}">${g>0?"+"+g:g}</text>`;
  const line = (series, color) => series.length ?
    `<polyline fill="none" stroke="${color}" stroke-width="2" points="${series.map(p => X(p.day)+","+Y(p.valence)).join(" ")}"/>` +
    series.map(p => `<circle cx="${X(p.day)}" cy="${Y(p.valence)}" r="2.5" fill="${color}"><title>${new Date(p.day*1000).toLocaleDateString()} 效价 ${p.valence}（${p.n}条）</title></circle>`).join("") : "";
  s += line(d.expose, "#d85c5c") + line(d.engage, "#45b880");
  svg.innerHTML = s;
  const last = d.engage[d.engage.length - 1];
  if (last) {
    const mix = last.mix.map((v, i) => [v, d.emotions[i]]).sort((a, b) => b[0] - a[0]).slice(0, 4)
      .filter(x => x[0] > 0.02).map(([v, n]) => `${n} ${(v*100).toFixed(0)}%`).join(" · ");
    document.getElementById("emomix").textContent = "你最近点开内容的情绪构成：" + mix;
  }
}
async function loadCloud(days) {
  const d = await (await fetch(`/wordcloud?days=${days}&source=engage`)).json();
  const el = document.getElementById("cloud");
  if (!d.words.length) { el.innerHTML = '<p class="muted">窗口内没有数据。</p>'; return; }
  const max = d.words[0].n;
  el.innerHTML = d.words.map(w =>
    `<span style="font-size:${12 + 22 * Math.sqrt(w.n / max)}px;color:${valColor(w.valence)}" title="出现${w.n}次·效价${w.valence}">${w.w}</span>`).join("");
}
async function loadPro(days) {
  const d = await (await fetch(`/pro_content?days=${days}`)).json();
  const fmt = it => `<li>${it.title}<span class="meta">${it.up} · ${it.topic}` +
    (it.dur ? ` · 看了${Math.round(it.dwell/60)}/${Math.round(it.dur/60)}分钟` : "") + `</span></li>`;
  document.getElementById("pro-unfin").innerHTML = d.unfinished.map(fmt).join("") || '<p class="muted">没有未看完的。</p>';
  document.getElementById("pro-fin").innerHTML = d.finished.map(fmt).join("") || '<p class="muted">还没有看完的。</p>';
}
function winButtons(id, cb) {
  const el = document.getElementById(id);
  el.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target));
    cb(Number(e.target.dataset.d));
  });
}
async function loadProfile() {
  const d = await (await fetch("/profile")).json();
  document.getElementById("meta").textContent = `（${d.n_events} 个事件 · 引擎: ${d.classifier}${d.emotion_on ? "+情绪" : ""}）`;
  const topN = (dist, n) => dist.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, n).filter(x => x[0] > 0.005);
  const render = (elId, dist, cls) => {
    const el = document.getElementById(elId);
    el.innerHTML = "";
    for (const [v, i] of topN(dist, 12))
      el.insertAdjacentHTML("beforeend",
        `<div class="bar-row"><span class="name">${d.topics[i]}</span>
         <div class="bar-wrap"><div class="bar ${cls}" style="width:${Math.min(100, v * 250)}%"></div></div>
         <span class="pct">${(v * 100).toFixed(1)}%</span></div>`);
    if (!el.innerHTML) el.innerHTML = '<p class="muted">还没有足够数据。</p>';
  };
  render("long", d.long, "");
  render("short", d.short, "short");
  const gaps = d.topics.map((t, i) => [d.expose[i] - d.long[i], i]).sort((a, b) => b[0] - a[0]);
  const gapEl = document.getElementById("gap");
  const fmt = ([g, i], label) => `<div class="bar-row"><span class="name">${d.topics[i]}</span>
      <div class="bar-wrap"><div class="bar gap" style="width:${Math.min(100, Math.abs(g) * 400)}%"></div></div>
      <span class="pct">${label}</span></div>`;
  for (const x of gaps.slice(0, 4)) if (x[0] > 0.01) gapEl.insertAdjacentHTML("beforeend", fmt(x, "被投喂↑"));
  for (const x of gaps.slice(-4).reverse()) if (x[0] < -0.01) gapEl.insertAdjacentHTML("beforeend", fmt(x, "你主动↑"));
  const dr = document.getElementById("drivers");
  for (const [topic, items] of Object.entries(d.drivers))
    dr.insertAdjacentHTML("beforeend", `<div class="bar-row"><span class="name">${topic}</span></div>
      <div class="drivers">${items.map(x => `${x.title}（${x.up}）`).join("<br>")}</div>`);
}
loadProfile(); loadEmotion(); loadCloud(30); loadPro(30);
winButtons("cloudwin", loadCloud);
winButtons("prowin", loadPro);
</script>
