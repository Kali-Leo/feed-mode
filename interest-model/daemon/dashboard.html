<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interests</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f1ee;
    --panel: #ffffff;
    --ink: #17170f;
    --ink-2: #5c5a52;
    --ink-3: #a09e93;
    --line: #edebe6;
    --blue: #2a78d6;
    --orange: #eb6834;
    --link: #1a5fb4;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { font-family: -apple-system, "SF Pro SC", system-ui, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
         color: var(--ink); max-width: 900px; margin: 0 auto; padding: 26px 18px 60px;
         font-size: 13px; line-height: 1.5; font-feature-settings: "tnum"; }
  section.panel { background: var(--panel); border-radius: var(--radius); padding: 18px 20px 20px;
                  margin-bottom: 18px; box-shadow: 0 1px 2px rgba(23,23,15,.04), 0 8px 24px -12px rgba(23,23,15,.10); }
  h2 { font-size: 15px; font-weight: 700; letter-spacing: .02em; margin: 0 0 14px;
       display: flex; align-items: center; gap: 14px; }
  h2::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--ink); margin-right: -4px; }
  .seg { display: inline-flex; background: #f0efeb; border-radius: 9px; padding: 2.5px; font-weight: 400; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--ink-2); border-radius: 7px;
                padding: 3px 11px; cursor: pointer; font-size: 12px; line-height: 1.5;
                transition: all .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600;
                   box-shadow: 0 1px 3px rgba(23,23,15,.12); }
  .legend { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--ink-2); display: flex; gap: 14px; }
  .legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: 2px; margin-right: 6px; }
  #chartwrap { position: relative; }
  #tip { position: absolute; pointer-events: none; background: rgba(23,23,15,.92); color: #fff; font-size: 11px;
         padding: 5px 9px; border-radius: 7px; white-space: nowrap; display: none; z-index: 2;
         box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #cloudc { display: block; width: 100%; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { padding: 8px 2px; border-bottom: 1px solid var(--line); }
  ul.items li:last-child { border-bottom: 0; }
  ul.items a, .card .t { color: var(--link); text-decoration: none; }
  ul.items a:hover, .card .t:hover { text-decoration: underline; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 12px; }
  .card { display: flex; gap: 12px; border-radius: 10px; padding: 10px; background: #faf9f7;
          transition: background .15s, transform .15s, box-shadow .15s; }
  .card:hover { background: #fff; box-shadow: 0 2px 10px rgba(23,23,15,.10); transform: translateY(-1px); }
  .card .thumb { width: 132px; height: 82px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #edebe6; }
  .card .body { min-width: 0; display: flex; flex-direction: column; flex: 1; }
  .card .t { font-size: 13px; line-height: 1.45; font-weight: 550;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { color: var(--ink-3); font-size: 11px; margin-top: 4px; }
  .card .grow { flex: 1; }
  .prog { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .prog i { display: block; height: 100%; border-radius: 2px; background: var(--orange); }
  .prog i.done { background: #1baf7a; }
  .meta { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
  .ni-topic { font-weight: 650; font-size: 13px; }
  .ni-share { color: var(--blue); font-size: 12px; font-weight: 600; margin-left: 8px; }
  .empty { color: var(--ink-3); padding: 6px 0; }
  svg text { font-size: 10px; fill: var(--ink-3); }
</style>

<section class="panel">

<h2><span data-i="emoTitle">内容情绪</span>
  <span class="seg" id="ecat">
    <button data-c="all" class="on" data-i="catAll">全部</button><button data-c="pro" data-i="catPro">专业</button><button data-c="ent" data-i="catEnt">娱乐</button><button data-c="gent" data-i="catGent">精选娱乐</button>
  </span>
  <span class="legend"><span><i style="background:#eb6834"></i><span data-i="legFeed">投喂</span></span><span><i style="background:#2a78d6"></i><span data-i="legPick">选择</span></span></span>
</h2>
<div id="chartwrap">
  <svg id="chart" width="100%" height="190" viewBox="0 0 860 190"></svg>
  <div id="tip"></div>
</div>
</section>

<section class="panel">
<h2><span data-i="cloudTitle">词云</span>
  <span class="seg" id="cwin">
    <button data-d="7" data-i="w7">7天</button><button data-d="30" class="on" data-i="w30">30天</button><button data-d="90" data-i="w90">90天</button><button data-d="365" data-i="w365">一年</button>
  </span>
</h2>
<canvas id="cloudc" width="860" height="380"></canvas>
</section>

<section class="panel">
<h2><span data-i="newTitle">新的兴趣</span></h2>
<ul class="items" id="newint"></ul>
</section>

<section class="panel">
<h2><span data-i="proTitle">专业内容</span> <span class="seg" id="ptab"><button data-t="unfin" class="on" data-i="unfin">没看完</button><button data-t="fin" data-i="fin">看完</button></span>
  <span class="seg" id="pcat"></span></h2>
<div class="cards" id="procards"></div>
</section>

<script>
const ZH = (navigator.language || "").toLowerCase().startsWith("zh");
const I18N = {
  emoTitle: "Content emotion", catAll: "All", catPro: "Learn", catEnt: "Fun", catGent: "Feel-good",
  legFeed: "Fed to me", legPick: "My choice",
  cloudTitle: "Word cloud", w7: "7d", w30: "30d", w90: "90d", w365: "1y",
  newTitle: "New interests", proTitle: "Informative content", unfin: "Unfinished", fin: "Finished",
};
const T = {
  noData: ZH ? "没有数据" : "No data",
  none: ZH ? "没有" : "None",
  empty: ZH ? "暂无" : "None yet",
  valence: ZH ? "效价" : "valence",
  items: ZH ? "条" : "items",
  catAllChip: ZH ? "全部" : "All",
  min: ZH ? "分钟" : "min",
};
if (!ZH) document.querySelectorAll("[data-i]").forEach(e => { const v = I18N[e.dataset.i]; if (v) e.textContent = v; });
const C_FEED = "#eb6834", C_PICK = "#2a78d6";
const linkOf = (site, id) => !id ? null :
  id.startsWith("BV") ? `https://www.bilibili.com/video/${id}` :
  site === "youtube" ? `https://www.youtube.com/watch?v=${id}` : null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const titleHtml = it => {
  const url = linkOf(it.site, it.id);
  const t = esc(it.title || it.t || "");
  return url ? `<a href="${url}" target="_blank">${t}</a>` : t;
};

// ---------- 情绪双曲线 ----------
let curveData = null;
async function loadEmotion(cat) {
  const d = await (await fetch(`/emotion_series?days=90&cat=${cat}`)).json();
  curveData = d;
  const svg = document.getElementById("chart");
  const all = [...d.expose, ...d.engage];
  if (!all.length) { svg.innerHTML = '<text x="20" y="40">' + T.noData + '</text>'; return; }
  const days = [...new Set(all.map(p => p.day))].sort((a, b) => a - b);
  const X = t => 26 + (days.indexOf(t) / Math.max(1, days.length - 1)) * 780;
  const Y = v => 95 - v * 40;
  let s = "";
  for (const g of [-2, -1, 0, 1, 2])
    s += `<line x1="26" x2="806" y1="${Y(g)}" y2="${Y(g)}" stroke="${g === 0 ? "#dcdbd6" : "#f1f0ec"}"/><text x="4" y="${Y(g) + 3}">${g > 0 ? "+" + g : g}</text>`;
  const first = days[0], last = days[days.length - 1];
  const dstr = t => { const D = new Date(t * 1000); return `${D.getMonth() + 1}.${D.getDate()}`; };
  s += `<text x="26" y="186">${dstr(first)}</text><text x="790" y="186">${dstr(last)}</text>`;
  const mkPath = (series, color, label) => {
    if (!series.length) return "";
    const pts = series.map(p => [X(p.day), Y(p.valence)]);
    let path = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) path += `L${pts[i][0]},${pts[i][1]}`;
    const end = pts[pts.length - 1];
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>` +
           `<text x="${Math.min(end[0] + 6, 820)}" y="${end[1] + 3}" style="fill:${color};font-weight:600">${label}</text>`;
  };
  s += mkPath(d.expose, C_FEED, ZH ? "投喂" : "Fed") + mkPath(d.engage, C_PICK, ZH ? "选择" : "Chosen");
  svg.innerHTML = s;
}
document.getElementById("chart").addEventListener("mousemove", e => {
  if (!curveData) return;
  const tip = document.getElementById("tip");
  const r = e.currentTarget.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width * 860, my = (e.clientY - r.top) / r.height * 190;
  let best = null;
  const all = [...new Set([...curveData.expose, ...curveData.engage].map(p => p.day))].sort((a, b) => a - b);
  const X = t => 26 + (all.indexOf(t) / Math.max(1, all.length - 1)) * 780;
  const Y = v => 95 - v * 40;
  for (const [series, name] of [[curveData.expose, ZH ? "投喂" : "Fed"], [curveData.engage, ZH ? "选择" : "Chosen"]])
    for (const p of series) {
      const dx = X(p.day) - mx, dy = Y(p.valence) - my, dd = dx * dx + dy * dy;
      if (!best || dd < best.dd) best = { dd, p, name };
    }
  if (best && best.dd < 900) {
    const D = new Date(best.p.day * 1000);
    tip.textContent = `${D.getMonth() + 1}.${D.getDate()} ${best.name} ${T.valence} ${best.p.valence} · ${best.p.n} ${T.items}`;
    tip.style.left = e.clientX - r.left + 12 + "px";
    tip.style.top = e.clientY - r.top - 8 + "px";
    tip.style.display = "block";
  } else tip.style.display = "none";
});
document.getElementById("chart").addEventListener("mouseleave", () => document.getElementById("tip").style.display = "none");

// ---------- 词云：中心向外螺旋堆叠 ----------
const valColor = v => {
  const t = Math.max(-2, Math.min(2, v)) / 2;
  const mix = (a, b, k) => Math.round(a + (b - a) * k);
  const mid = [122, 121, 117], pos = [42, 120, 214], neg = [194, 58, 57];
  const c = t >= 0 ? [mix(mid[0], pos[0], t), mix(mid[1], pos[1], t), mix(mid[2], pos[2], t)]
                   : [mix(mid[0], neg[0], -t), mix(mid[1], neg[1], -t), mix(mid[2], neg[2], -t)];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
};
async function loadCloud(days) {
  const d = await (await fetch(`/wordcloud?days=${days}&source=engage`)).json();
  const cv = document.getElementById("cloudc");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 860, H = 380;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (!d.words.length) { ctx.fillStyle = "#8a897f"; ctx.font = "13px system-ui"; ctx.fillText(T.noData, 20, 40); return; }
  const ns = d.words.map(w => w.n);
  const nMax = ns[0], nMin = ns[ns.length - 1];
  const tOf = n => nMax > nMin ? (n - nMin) / (nMax - nMin) : 0.5;
  const tMed = tOf(ns[Math.floor(ns.length / 2)]);
  const gamma = (tMed > 0 && tMed < 1) ? Math.min(3, Math.max(0.3, Math.log(0.5) / Math.log(tMed))) : 1;
  const cx = W / 2, cy = H / 2;
  const placed = [];
  const collide = (x, y, w, h) => x < 2 || y < 2 || x + w > W - 2 || y + h > H - 2 ||
    placed.some(r => x < r.x + r.w + 3 && x + w + 3 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const wd of d.words) {
    const size = Math.round(13 + 34 * Math.pow(tOf(wd.n), gamma));
    const vert = rnd() < 0.22 && wd.w.length <= 4;
    ctx.font = `${size >= 26 ? 600 : 400} ${size}px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif`;
    const m = ctx.measureText(wd.w);
    const tw = vert ? size * 1.1 : m.width, th = vert ? m.width : size * 1.15;
    let px = null, py = null;
    for (let i = 0; i < 900; i++) {
      const a = 0.35 * i, rr = 2.2 * a;
      const x = cx + rr * Math.cos(a + rnd() * .3) - tw / 2, y = cy + rr * 0.52 * Math.sin(a + rnd() * .3) - th / 2;
      if (!collide(x, y, tw, th)) { px = x; py = y; break; }
    }
    if (px === null) continue;
    placed.push({ x: px, y: py, w: tw, h: th });
    ctx.fillStyle = valColor(wd.valence);
    if (vert) {
      ctx.save();
      ctx.translate(px + size * 0.28, py + 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillText(wd.w, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(wd.w, px, py + th * 0.82);
    }
  }
}

// ---------- 新的兴趣 ----------
async function loadNew() {
  const d = await (await fetch("/new_interests")).json();
  const el = document.getElementById("newint");
  if (!d.interests.length) { el.innerHTML = '<li class="empty">' + T.empty + '</li>'; return; }
  el.innerHTML = d.interests.map(x =>
    `<li><span class="ni-topic">${esc(ZH ? x.topic : (x.topic_en || x.topic))}</span><span class="ni-share">${(x.share * 100).toFixed(0)}%↑</span>` +
    (x.items.length ? `<div class="meta">${x.items.map(titleHtml).join(" · ")}</div>` : "") + `</li>`).join("");
}

// ---------- 专业内容 ----------
let proData = null, proTab = "unfin", proCat = "全部", groupEn = {};
async function loadPro() {
  proData = await (await fetch("/pro_content?days=90")).json();
  for (const it of [...proData.unfinished, ...proData.finished]) if (it.group) groupEn[it.group] = it.group_en || it.group;
  renderProCats();
  renderPro();
}
function renderProCats() {
  const items = [...proData.unfinished, ...proData.finished];
  const cnt = {};
  for (const it of items) cnt[it.group] = (cnt[it.group] || 0) + 1;
  const cats = ["全部", ...Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])];
  const el = document.getElementById("pcat");
  el.innerHTML = cats.map(c =>
    `<button data-g="${c}" class="${c === proCat ? "on" : ""}">${c === "全部" ? T.catAllChip : esc(ZH ? c : (groupEn[c] || c))}${c === "全部" ? "" : " " + cnt[c]}</button>`).join("");
}
function renderPro() {
  const list = (proTab === "unfin" ? proData.unfinished : proData.finished)
    .filter(it => proCat === "全部" || it.group === proCat);
  const el = document.getElementById("procards");
  if (!list.length) { el.innerHTML = '<div class="empty">' + T.none + '</div>'; return; }
  el.innerHTML = list.map(it => {
    const url = linkOf(it.site, it.id);
    const pct = it.dur > 0 ? Math.min(100, Math.round(it.dwell / it.dur * 100)) : (proTab === "fin" ? 100 : 0);
    const D = new Date(it.ts * 1000);
    return `<div class="card">` +
      (it.pic ? `<img class="thumb" src="${esc(it.pic)}@256w_160h_1c" referrerpolicy="no-referrer" loading="lazy">` : `<div class="thumb"></div>`) +
      `<div class="body"><a class="t" ${url ? `href="${url}" target="_blank"` : ""}>${esc(it.title)}</a>` +
      `<div class="m">${esc(it.up)} · ${esc(ZH ? it.topic : (it.topic_en || it.topic))} · ${D.getMonth() + 1}.${D.getDate()}` +
      (it.dur ? ` · ${Math.round(it.dwell / 60)}/${Math.round(it.dur / 60)} ${T.min}` : "") + `</div>` +
      `<div class="grow"></div><div class="prog"><i class="${pct >= 80 ? "done" : ""}" style="width:${pct}%"></i></div></div></div>`;
  }).join("");
}
document.getElementById("ptab").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#ptab button").forEach(b => b.classList.toggle("on", b === e.target));
  proTab = e.target.dataset.t;
  renderPro();
});
document.getElementById("pcat").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  proCat = e.target.dataset.g;
  renderProCats();
  renderPro();
});

function seg(id, attr, cb) {
  const el = document.getElementById(id);
  el.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target));
    cb(e.target.dataset[attr]);
  });
}
seg("ecat", "c", c => loadEmotion(c));
seg("cwin", "d", d => loadCloud(Number(d)));

// 零数据时只显示连接引导，有数据后这段永不出现
(async () => {
  const p = await (await fetch("/profile")).json();
  if (p.update) {
    const u = document.createElement("div");
    u.style.cssText = "text-align:center;font-size:13px;padding:6px 0;opacity:.75";
    u.innerHTML = ZH
      ? `新版本 v${p.update} 已发布：<a href="https://github.com/Kali-Leo/feed-mode/releases/latest">下载</a>`
      : `Version ${p.update} is out: <a href="https://github.com/Kali-Leo/feed-mode/releases/latest">download</a>`;
    document.body.prepend(u);
  }
  if (p.n_events > 0) { loadEmotion("all"); loadCloud(30); loadNew(); loadPro(); return; }
  document.querySelectorAll("section.panel").forEach(s => s.remove());
  const g = document.createElement("section");
  g.className = "panel";
  g.style.cssText = "text-align:center;padding:56px 24px";
  g.innerHTML = ZH
    ? `<p style="margin:0 0 20px">还没有数据。先连接浏览器脚本，然后正常刷视频，这里会自动累积。</p>
       <p style="margin:0"><a href="/pair?site=bilibili">连接 B站 脚本</a>　·　<a href="/pair?site=youtube">连接 YouTube 脚本</a></p>`
    : `<p style="margin:0 0 20px">No data yet. Connect the browser script, then browse as usual — this page fills in automatically.</p>
       <p style="margin:0"><a href="/pair?site=bilibili">Connect Bilibili script</a>　·　<a href="/pair?site=youtube">Connect YouTube script</a></p>`;
  document.body.appendChild(g);
})();
</script>
