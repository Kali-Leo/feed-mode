<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兴趣</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fcfcfb;
         color: #0b0b0b; max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; font-size: 13px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .5px; color: #0b0b0b;
       margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #e8e7e3;
       display: flex; align-items: baseline; gap: 14px; }
  h2:first-of-type { margin-top: 8px; }
  .seg { display: inline-flex; gap: 0; font-weight: 400; }
  .seg button { border: 1px solid #dcdbd6; border-right: 0; background: #fff; color: #52514e;
                padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-right: 1px solid #dcdbd6; border-radius: 0 4px 4px 0; }
  .seg button.on { background: #0b0b0b; color: #fff; border-color: #0b0b0b; }
  .legend { margin-left: auto; font-weight: 400; font-size: 12px; color: #52514e; display: flex; gap: 12px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  #chartwrap { position: relative; }
  #tip { position: absolute; pointer-events: none; background: #0b0b0b; color: #fff; font-size: 11px;
         padding: 4px 8px; border-radius: 4px; white-space: nowrap; display: none; z-index: 2; }
  #cloudc { display: block; width: 100%; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  @media (max-width: 680px) { .cols { grid-template-columns: 1fr; } }
  .sub { font-size: 12px; font-weight: 600; color: #52514e; margin: 2px 0 6px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { padding: 4px 0; border-bottom: 1px solid #f1f0ec; line-height: 1.45; }
  ul.items a { color: #1a5fb4; text-decoration: none; }
  ul.items a:hover { text-decoration: underline; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 10px; }
  .card { display: flex; gap: 10px; border: 1px solid #eceae5; border-radius: 6px; padding: 8px; background: #fff; }
  .card .thumb { width: 128px; height: 80px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #f1f0ec; }
  .card .body { min-width: 0; display: flex; flex-direction: column; }
  .card .t { font-size: 13px; line-height: 1.4; color: #1a5fb4; text-decoration: none; font-weight: 500;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .t:hover { text-decoration: underline; }
  .card .m { color: #8a897f; font-size: 11px; margin-top: 3px; }
  .card .grow { flex: 1; }
  .prog { height: 3px; background: #eceae5; border-radius: 2px; margin-top: 6px; }
  .prog i { display: block; height: 100%; border-radius: 2px; background: #eb6834; }
  .prog i.done { background: #1baf7a; }
  .meta { color: #8a897f; font-size: 11px; }
  .ni-topic { font-weight: 600; }
  .ni-share { color: #2a78d6; font-size: 12px; margin-left: 6px; }
  .empty { color: #8a897f; padding: 8px 0; }
  svg text { font-size: 10px; fill: #8a897f; }
</style>

<h2>内容情绪
  <span class="seg" id="ecat">
    <button data-c="all" class="on">全部</button><button data-c="pro">专业</button><button data-c="ent">娱乐</button><button data-c="gent">精选娱乐</button>
  </span>
  <span class="legend"><span><i style="background:#eb6834"></i>投喂</span><span><i style="background:#2a78d6"></i>选择</span></span>
</h2>
<div id="chartwrap">
  <svg id="chart" width="100%" height="190" viewBox="0 0 860 190"></svg>
  <div id="tip"></div>
</div>

<h2>词云
  <span class="seg" id="cwin">
    <button data-d="7">7天</button><button data-d="30" class="on">30天</button><button data-d="90">90天</button><button data-d="365">一年</button>
  </span>
</h2>
<canvas id="cloudc" width="860" height="380"></canvas>

<h2>新的兴趣</h2>
<ul class="items" id="newint"></ul>

<h2>专业内容 <span class="seg" id="ptab"><button data-t="unfin" class="on">没看完</button><button data-t="fin">看完</button></span>
  <span class="seg" id="pcat"></span></h2>
<div class="cards" id="procards"></div>

<script>
const C_FEED = "#eb6834", C_PICK = "#2a78d6";
const linkOf = (site, id) => !id ? null :
  id.startsWith("BV") ? `https://www.bilibili.com/video/${id}` :
  site === "youtube" ? `https://www.youtube.com/watch?v=${id}` : null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const titleHtml = it => {
  const url = linkOf(it.site, it.id);
  const t = esc(it.title || it.t || "");
  return url ? `<a href="${url}" target="_blank">${t}</a>` : t;
};

// ---------- 情绪双曲线 ----------
let curveData = null;
async function loadEmotion(cat) {
  const d = await (await fetch(`/emotion_series?days=90&cat=${cat}`)).json();
  curveData = d;
  const svg = document.getElementById("chart");
  const all = [...d.expose, ...d.engage];
  if (!all.length) { svg.innerHTML = '<text x="20" y="40">没有数据</text>'; return; }
  const days = [...new Set(all.map(p => p.day))].sort((a, b) => a - b);
  const X = t => 26 + (days.indexOf(t) / Math.max(1, days.length - 1)) * 780;
  const Y = v => 95 - v * 40;
  let s = "";
  for (const g of [-2, -1, 0, 1, 2])
    s += `<line x1="26" x2="806" y1="${Y(g)}" y2="${Y(g)}" stroke="${g === 0 ? "#dcdbd6" : "#f1f0ec"}"/><text x="4" y="${Y(g) + 3}">${g > 0 ? "+" + g : g}</text>`;
  const first = days[0], last = days[days.length - 1];
  const dstr = t => { const D = new Date(t * 1000); return `${D.getMonth() + 1}.${D.getDate()}`; };
  s += `<text x="26" y="186">${dstr(first)}</text><text x="790" y="186">${dstr(last)}</text>`;
  const mkPath = (series, color, label) => {
    if (!series.length) return "";
    const pts = series.map(p => [X(p.day), Y(p.valence)]);
    let path = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) path += `L${pts[i][0]},${pts[i][1]}`;
    const end = pts[pts.length - 1];
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>` +
           `<text x="${Math.min(end[0] + 6, 820)}" y="${end[1] + 3}" style="fill:${color};font-weight:600">${label}</text>`;
  };
  s += mkPath(d.expose, C_FEED, "投喂") + mkPath(d.engage, C_PICK, "选择");
  svg.innerHTML = s;
}
document.getElementById("chart").addEventListener("mousemove", e => {
  if (!curveData) return;
  const tip = document.getElementById("tip");
  const r = e.currentTarget.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width * 860, my = (e.clientY - r.top) / r.height * 190;
  let best = null;
  const all = [...new Set([...curveData.expose, ...curveData.engage].map(p => p.day))].sort((a, b) => a - b);
  const X = t => 26 + (all.indexOf(t) / Math.max(1, all.length - 1)) * 780;
  const Y = v => 95 - v * 40;
  for (const [series, name] of [[curveData.expose, "投喂"], [curveData.engage, "选择"]])
    for (const p of series) {
      const dx = X(p.day) - mx, dy = Y(p.valence) - my, dd = dx * dx + dy * dy;
      if (!best || dd < best.dd) best = { dd, p, name };
    }
  if (best && best.dd < 900) {
    const D = new Date(best.p.day * 1000);
    tip.textContent = `${D.getMonth() + 1}.${D.getDate()} ${best.name} 效价${best.p.valence} ${best.p.n}条`;
    tip.style.left = e.clientX - r.left + 12 + "px";
    tip.style.top = e.clientY - r.top - 8 + "px";
    tip.style.display = "block";
  } else tip.style.display = "none";
});
document.getElementById("chart").addEventListener("mouseleave", () => document.getElementById("tip").style.display = "none");

// ---------- 词云：中心向外螺旋堆叠 ----------
const valColor = v => {
  const t = Math.max(-2, Math.min(2, v)) / 2;
  const mix = (a, b, k) => Math.round(a + (b - a) * k);
  const mid = [122, 121, 117], pos = [42, 120, 214], neg = [194, 58, 57];
  const c = t >= 0 ? [mix(mid[0], pos[0], t), mix(mid[1], pos[1], t), mix(mid[2], pos[2], t)]
                   : [mix(mid[0], neg[0], -t), mix(mid[1], neg[1], -t), mix(mid[2], neg[2], -t)];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
};
async function loadCloud(days) {
  const d = await (await fetch(`/wordcloud?days=${days}&source=engage`)).json();
  const cv = document.getElementById("cloudc");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 860, H = 380;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (!d.words.length) { ctx.fillStyle = "#8a897f"; ctx.font = "13px system-ui"; ctx.fillText("没有数据", 20, 40); return; }
  const ns = d.words.map(w => w.n);
  const nMax = ns[0], nMin = ns[ns.length - 1];
  const tOf = n => nMax > nMin ? (n - nMin) / (nMax - nMin) : 0.5;
  const tMed = tOf(ns[Math.floor(ns.length / 2)]);
  const gamma = (tMed > 0 && tMed < 1) ? Math.min(3, Math.max(0.3, Math.log(0.5) / Math.log(tMed))) : 1;
  const cx = W / 2, cy = H / 2;
  const placed = [];
  const collide = (x, y, w, h) => x < 2 || y < 2 || x + w > W - 2 || y + h > H - 2 ||
    placed.some(r => x < r.x + r.w + 3 && x + w + 3 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const wd of d.words) {
    const size = Math.round(13 + 34 * Math.pow(tOf(wd.n), gamma));
    const vert = rnd() < 0.22 && wd.w.length <= 4;
    ctx.font = `${size >= 26 ? 600 : 400} ${size}px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif`;
    const m = ctx.measureText(wd.w);
    const tw = vert ? size * 1.1 : m.width, th = vert ? m.width : size * 1.15;
    let px = null, py = null;
    for (let i = 0; i < 900; i++) {
      const a = 0.35 * i, rr = 2.2 * a;
      const x = cx + rr * Math.cos(a + rnd() * .3) - tw / 2, y = cy + rr * 0.52 * Math.sin(a + rnd() * .3) - th / 2;
      if (!collide(x, y, tw, th)) { px = x; py = y; break; }
    }
    if (px === null) continue;
    placed.push({ x: px, y: py, w: tw, h: th });
    ctx.fillStyle = valColor(wd.valence);
    if (vert) {
      ctx.save();
      ctx.translate(px + size * 0.28, py + 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillText(wd.w, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(wd.w, px, py + th * 0.82);
    }
  }
}

// ---------- 新的兴趣 ----------
async function loadNew() {
  const d = await (await fetch("/new_interests")).json();
  const el = document.getElementById("newint");
  if (!d.interests.length) { el.innerHTML = '<li class="empty">暂无</li>'; return; }
  el.innerHTML = d.interests.map(x =>
    `<li><span class="ni-topic">${esc(x.topic)}</span><span class="ni-share">${(x.share * 100).toFixed(0)}%↑</span>` +
    (x.items.length ? `<div class="meta">${x.items.map(titleHtml).join(" · ")}</div>` : "") + `</li>`).join("");
}

// ---------- 专业内容 ----------
let proData = null, proTab = "unfin", proCat = "全部";
async function loadPro() {
  proData = await (await fetch("/pro_content?days=90")).json();
  renderProCats();
  renderPro();
}
function renderProCats() {
  const items = [...proData.unfinished, ...proData.finished];
  const cnt = {};
  for (const it of items) cnt[it.group] = (cnt[it.group] || 0) + 1;
  const cats = ["全部", ...Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])];
  const el = document.getElementById("pcat");
  el.innerHTML = cats.map(c =>
    `<button data-g="${c}" class="${c === proCat ? "on" : ""}">${c}${c === "全部" ? "" : " " + cnt[c]}</button>`).join("");
}
function renderPro() {
  const list = (proTab === "unfin" ? proData.unfinished : proData.finished)
    .filter(it => proCat === "全部" || it.group === proCat);
  const el = document.getElementById("procards");
  if (!list.length) { el.innerHTML = '<div class="empty">没有</div>'; return; }
  el.innerHTML = list.map(it => {
    const url = linkOf(it.site, it.id);
    const pct = it.dur > 0 ? Math.min(100, Math.round(it.dwell / it.dur * 100)) : (proTab === "fin" ? 100 : 0);
    const D = new Date(it.ts * 1000);
    return `<div class="card">` +
      (it.pic ? `<img class="thumb" src="${esc(it.pic)}@256w_160h_1c" referrerpolicy="no-referrer" loading="lazy">` : `<div class="thumb"></div>`) +
      `<div class="body"><a class="t" ${url ? `href="${url}" target="_blank"` : ""}>${esc(it.title)}</a>` +
      `<div class="m">${esc(it.up)} · ${esc(it.topic)} · ${D.getMonth() + 1}.${D.getDate()}` +
      (it.dur ? ` · ${Math.round(it.dwell / 60)}/${Math.round(it.dur / 60)}分钟` : "") + `</div>` +
      `<div class="grow"></div><div class="prog"><i class="${pct >= 80 ? "done" : ""}" style="width:${pct}%"></i></div></div></div>`;
  }).join("");
}
document.getElementById("ptab").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#ptab button").forEach(b => b.classList.toggle("on", b === e.target));
  proTab = e.target.dataset.t;
  renderPro();
});
document.getElementById("pcat").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  proCat = e.target.dataset.g;
  renderProCats();
  renderPro();
});

function seg(id, attr, cb) {
  const el = document.getElementById(id);
  el.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target));
    cb(e.target.dataset[attr]);
  });
}
seg("ecat", "c", c => loadEmotion(c));
seg("cwin", "d", d => loadCloud(Number(d)));
loadEmotion("all"); loadCloud(30); loadNew(); loadPro();
</script>
